plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autoaim'
    compileSdk 34

    defaultConfig {
        applicationId "com.autoaim"
        minSdk 31        // Android 12+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'  // 只支持 64 位 ARM
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fPIC"
                arguments "-DANDROID_STL=c++_shared",
                          "-DMNN_OPENCL=ON",       // OpenCL GPU 加速
                          "-DMNN_VULKAN=ON",       // Vulkan GPU 备选
                          "-DMNN_ARM82=ON",        // ARM NEON 优化
                          "-DMNN_USE_THREAD_POOL=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // MNN AAR（从 Maven 或本地 AAR 引入）
    // implementation files('libs/MNN-2.9.0.aar')

    // Shizuku（触控注入权限）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}
